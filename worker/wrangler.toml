# Ludo Live realtime rooms: one Durable Object per 6-character room code.
# Deploy: cd worker && npm ci && npx wrangler deploy   (needs CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID)
name = "ludo-live"
main = "src/index.ts"
compatibility_date = "2026-06-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "LudoRoom"

# SQLite-backed Durable Objects are available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["LudoRoom"]

[observability]
enabled = true
