name: Android CI
# Builds the Capacitor Android App Bundle (AAB) from the same web build.
# Signs it only when the upload-key secrets exist (set by devops-hq/agent/create-upload-key.sh);
# otherwise the AAB is unsigned. Either way it is uploaded as the `app-release-aab` artifact.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAN_PUBLISH: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' && secrets.KEYSTORE_BASE64 != '' }}
      VITE_WS_URL: ${{ vars.VITE_WS_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      # ubuntu-latest ships the Android SDK (ANDROID_HOME); setup-android@v3 currently breaks on its sdkmanager.
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Version from run number
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Build release AAB
        working-directory: android
        run: chmod +x gradlew && ./gradlew bundleRelease --no-daemon
      - name: Sign AAB (only if the upload key secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::notice::No upload key secrets: AAB left unsigned."; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" "$AAB" "$KEY_ALIAS"
          rm -f "$RUNNER_TEMP/upload.jks"
          jarsigner -verify "$AAB" | tail -1
      - uses: actions/upload-artifact@v7
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
      # Upload to Google Play internal testing. Runs only on pushes to main, and only when both the
      # upload key and the PLAY_SERVICE_ACCOUNT_JSON secret exist; otherwise it is skipped with a notice.
      # See docs/PLAY-RELEASE.md for the one-time service account setup.
      - name: Skip Play upload (secrets missing)
        if: env.CAN_PUBLISH != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: echo "::notice::Play upload skipped. Add PLAY_SERVICE_ACCOUNT_JSON and the KEYSTORE_* secrets to publish to internal testing."
      - name: Upload to Play internal testing
        id: play
        if: env.CAN_PUBLISH == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sabinkhanal.ludolive
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
      # An app that has never had a release rolled out is a "draft app", and Play only accepts
      # draft releases for it. Retry as a draft so the bundle still lands; roll it out once in
      # Play Console and later runs go straight to testers.
      - name: Upload to Play internal testing as a draft
        if: steps.play.outcome == 'failure'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sabinkhanal.ludolive
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
