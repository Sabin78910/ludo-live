name: Android CI
# Builds the Capacitor Android App Bundle (AAB) from the same web build.
# Signs it only when the upload-key secrets exist (set by devops-hq/agent/create-upload-key.sh);
# otherwise the AAB is unsigned. Either way it is uploaded as the `app-release-aab` artifact.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_WS_URL: ${{ vars.VITE_WS_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      # ubuntu-latest ships the Android SDK (ANDROID_HOME); setup-android@v3 currently breaks on its sdkmanager.
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Version from run number
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Build release AAB
        working-directory: android
        run: chmod +x gradlew && ./gradlew bundleRelease --no-daemon
      - name: Sign AAB (only if the upload key secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::notice::No upload key secrets: AAB left unsigned."; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" "$AAB" "$KEY_ALIAS"
          rm -f "$RUNNER_TEMP/upload.jks"
          jarsigner -verify "$AAB" | tail -1
      - uses: actions/upload-artifact@v7
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
