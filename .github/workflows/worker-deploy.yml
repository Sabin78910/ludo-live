name: Deploy Worker (online rooms)
# Deploys the Cloudflare Worker + Durable Object in worker/ when it changes.
# Skips cleanly (green, with a notice) until the CLOUDFLARE_API_TOKEN secret exists.
on:
  push:
    branches: [main]
    paths: ["worker/**", "src/engine/**", ".github/workflows/worker-deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Check for Cloudflare secrets
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set, so the Worker was not deployed. Online mode stays 'coming soon'."
          fi
      - uses: actions/checkout@v7
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-node@v6
        if: env.HAS_TOKEN == 'true'
        with: { node-version: 22, cache: npm }
      - name: Test the engine and room logic first
        if: env.HAS_TOKEN == 'true'
        run: npm ci && npx vitest run src/engine worker
      - name: Deploy with wrangler
        if: env.HAS_TOKEN == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Worker URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Set the repo variable VITE_WS_URL to ${URL/https:/wss:} to turn on online mode." >> "$GITHUB_STEP_SUMMARY"
      - name: Rebuild the site so it picks up VITE_WS_URL
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml -R "$GITHUB_REPOSITORY" --ref main || true
